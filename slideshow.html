<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow en Vivo - Aracely & Jorge</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        #slideshow { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
        #slideshow img, #slideshow video { max-width: 100vw; max-height: 100vh; object-fit: contain; opacity: 0; transition: opacity 1.5s ease-in-out; position: absolute; }
        #slideshow img.active, #slideshow video.active { opacity: 1; }
        
        #counter { position: fixed; bottom: 30px; right: 30px; background: rgba(0,0,0,0.6); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 10; }
        
        /* TÍTULO CENTRADO Y EN UNA SOLA LÍNEA */
        #titulo {
            position: fixed;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            white-space: nowrap; /* Prohíbe que se parta en dos renglones */
            color: white;
            font-family: 'Cinzel', serif;
            font-size: 28px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            z-index: 10;
            opacity: 0.9;
            pointer-events: none; /* Permite hacer clic a través del título */
        }
        
        /* NOTIFICACIÓN DE NUEVA FOTO/VIDEO */
        .new-photo-notif { 
            position: fixed; top: 20px; left: 20px; 
            background: rgba(0, 0, 0, 0.85); border: 2px solid #D4A017; 
            border-radius: 12px; padding: 10px; 
            display: flex; flex-direction: column; align-items: center; gap: 8px; 
            opacity: 0; transform: translateX(-150%); 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 100; width: 220px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
        }
        .new-photo-notif.visible { opacity: 1; transform: translateX(0); }
        .new-photo-notif img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
        .notif-badge { background: #D4A017; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; width: 100%; text-align: center; }
        .notif-author { color: #fff; font-size: 13px; text-align: center; font-weight: 500; }

        /* INDICADOR DE PAUSA / REANUDACIÓN */
        .pause-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            color: rgba(255, 255, 255, 0.85);
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 200;
        }
        .pause-indicator.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="titulo">Aracely &amp; Jorge</div>
    
    <div id="newPhotoNotif" class="new-photo-notif">
        <span class="notif-badge" id="notifBadge">📸 ¡Nuevo!</span>
        <img id="notifImg" src="" alt="Nuevo">
        <span id="notifAuthor" class="notif-author"></span>
    </div>

    <div id="slideshow"></div>
    <div id="counter">0 archivos</div>

    <!-- Indicador visual de Pausa/Reanudación -->
    <div id="pauseIndicator" class="pause-indicator"></div>

    <script src="config.js"></script>
    <script>
        const { album } = CONFIG;
        firebase.initializeApp(album.firebase);
        const db = firebase.database();
        const fotosRef = db.ref('fotos');

        let fotos = [];
        let indiceActual = 0;
        let intervaloSlideshow;
        let timeoutVideo; 
        let lastPhotoCount = 0;
        let notifTimeout;
        let pauseTimeout;

        const TIEMPO_FOTO = 6000; // 6 segundos para fotos

        const slideshow = document.getElementById('slideshow');
        const counter = document.getElementById('counter');
        const newPhotoNotif = document.getElementById('newPhotoNotif');
        const pauseIndicator = document.getElementById('pauseIndicator');

        function limpiarTimers() {
            clearInterval(intervaloSlideshow);
            intervaloSlideshow = null; 
            clearTimeout(timeoutVideo);
        }

        fotosRef.orderByChild('fecha').on('value', (snapshot) => {
            fotos = [];
            snapshot.forEach((child) => {
                const data = child.val();
                if (!data.deleted) fotos.unshift({ id: child.key, ...data });
            });
            
            const currentCount = fotos.length;
            counter.textContent = `${currentCount} archivos`;
            
            if (currentCount > lastPhotoCount && lastPhotoCount !== 0) {
                const newest = fotos[0];
                document.getElementById('notifImg').src = newest.resourceType === 'video' 
                    ? newest.url.replace('/video/upload/', '/video/upload/so_0,du_2,e_preview/').replace(/\.[^.]+$/, '.jpg') 
                    : newest.url;
                document.getElementById('notifAuthor').textContent = newest.nombre || 'Anónimo';
                document.getElementById('notifBadge').textContent = newest.resourceType === 'video' ? '🎬 ¡Nuevo video!' : '📸 ¡Nueva foto!';
                newPhotoNotif.classList.add('visible');
                clearTimeout(notifTimeout);
                notifTimeout = setTimeout(() => newPhotoNotif.classList.remove('visible'), 6000);
            }
            lastPhotoCount = currentCount;
            renderSlideshow();
        });

        function renderSlideshow() {
            if (fotos.length === 0) return;
            slideshow.innerHTML = '';
            fotos.forEach((foto, i) => {
                let el;
                if (foto.resourceType === 'video') {
                    el = document.createElement('video');
                    el.src = foto.url;
                    el.muted = true;
                    el.playsInline = true;
                    el.preload = 'auto';
                } else {
                    el = document.createElement('img');
                    el.src = foto.url;
                }
                if (i === indiceActual) el.classList.add('active');
                slideshow.appendChild(el);
            });
        }

        function siguienteFoto() {
            const items = slideshow.children;
            if (items.length === 0) return;
            
            if (items[indiceActual]?.tagName === 'VIDEO') {
                items[indiceActual].pause();
            }
            
            items[indiceActual]?.classList.remove('active');
            indiceActual = (indiceActual + 1) % fotos.length;
            items[indiceActual]?.classList.add('active');

            const elementoActual = items[indiceActual];

            if (elementoActual.tagName === 'VIDEO') {
                elementoActual.play();

                const avanzarCuandoTermine = () => {
                    limpiarTimers();
                    siguienteFoto();
                };

                if (elementoActual.readyState >= 1 && !isNaN(elementoActual.duration)) {
                    timeoutVideo = setTimeout(avanzarCuandoTermine, elementoActual.duration * 1000);
                } else {
                    elementoActual.addEventListener('loadedmetadata', () => {
                        timeoutVideo = setTimeout(avanzarCuandoTermine, elementoActual.duration * 1000);
                    }, { once: true });
                }
                elementoActual.addEventListener('ended', avanzarCuandoTermine, { once: true });

            } else {
                iniciarSlideshow();
            }
        }

        function iniciarSlideshow() {
            limpiarTimers();
            intervaloSlideshow = setInterval(siguienteFoto, TIEMPO_FOTO);
        }

        setTimeout(() => {
            if (fotos.length > 0) { 
                renderSlideshow(); 
                iniciarSlideshow(); 
            }
        }, 2000);

        // LÓGICA DE PAUSA / REANUDACIÓN (El ícono se queda fijo mientras está pausado)
        document.addEventListener('click', () => {
            // No hacer nada si el elemento actual es un video (para no interrumpir sus controles)
            if (document.getElementById('slideshow').children[indiceActual]?.tagName === 'VIDEO') return;

            if (intervaloSlideshow) {
                // 1. Si está corriendo: PAUSAR
                limpiarTimers();
                pauseIndicator.textContent = '⏸'; // Solo el ícono, minimalista
                pauseIndicator.classList.add('visible'); // Se queda visible
            } else {
                // 2. Si está pausado: REANUDAR
                iniciarSlideshow();
                pauseIndicator.classList.remove('visible'); // Se oculta inmediatamente al reanudar
            }
        });

        document.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
